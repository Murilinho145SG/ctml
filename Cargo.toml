[workspace]
members = [
    "crates/ctml",
    "crates/ctml-compiler",
    "crates/ctml-css",
    "crates/ctml-renderer",
    "crates/cosmic-text",
    "examples/native-app",
]
resolver = "3"

[patch.crates-io]
cosmic-text = { path = "crates/cosmic-text" }

[workspace.dependencies]
cosmic-text = "0.19.0"
wgpu = "30.0.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winit = "0.30.13"
pollster = "0.4.0"
utf8-chars = "3.0.7"
ctml-compiler = { path = "crates/ctml-compiler" }
ctml-css = { path = "crates/ctml-css" }
cssparser = "0.37.0"
png = "0.18.1"
tokio = { version = "1.54.1", features = ["net", "rt", "time"] }
unicode-segmentation = "1.13.3"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
url = "2.5.8"
